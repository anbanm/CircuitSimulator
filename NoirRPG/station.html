<title>Platform Four Sandbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one screen. 3D station fills it. Left: the clock and the three layers. Bottom: the player's few actions. Overlays for the table and the count.
   Single dark look by choice, matching the Secunda demo. */
:root { color-scheme: dark; --bg:#14100e; --panel:rgba(24,19,16,.88); --line:#3b3029; --fg:#e9e0d4; --muted:#a59685; --ochre:#dba04a; --violet:#a58fc9; --brick:#b5553c; --good:#8fb98a;
  --serif:"Lora",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; }
html,body{height:100%} body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;overflow:hidden}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#0c0a09}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-100%);font:500 10.5px var(--mono);letter-spacing:.04em;background:rgba(12,10,9,.72);border:1px solid var(--line);padding:1px 5px;white-space:nowrap}
.lab.you{color:var(--violet);border-color:var(--violet)} .lab.ally{color:var(--good);border-color:var(--good)} .lab.foe{color:var(--brick);border-color:var(--brick)} .lab.say{color:var(--fg);background:rgba(12,10,9,.9);font-family:var(--serif);font-size:12px}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(3px)}
.k{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}
#left{top:12px;left:max(12px,env(safe-area-inset-left,0px));width:270px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
#clock{font:500 30px var(--mono);color:var(--ochre);line-height:1} #dep{font:11px var(--mono);color:var(--muted)}
.layer{display:flex;flex-direction:column;gap:3px;font-size:12.5px;line-height:1.35} .layer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.layer li.now{color:var(--fg)} .layer li.done{opacity:.45;text-decoration:line-through}
#status{display:flex;gap:10px;font:11px var(--mono);color:var(--muted)} #status b{color:var(--fg);font-weight:500}
#prompt{left:50%;top:14px;transform:translateX(-50%);padding:10px 14px;max-width:min(560px,calc(100% - 320px));text-align:center;font:15px/1.4 var(--serif);border-color:var(--brick)}
#prompt .btns{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
#log{right:max(12px,env(safe-area-inset-right,0px));top:12px;width:240px;max-height:46%;overflow:hidden;padding:8px 10px;display:flex;flex-direction:column-reverse;gap:3px;font:11.5px/1.35 var(--mono);color:var(--muted)}
#log div:first-child{color:var(--fg)}
button{font:500 12px var(--mono);color:var(--fg);background:#241c17;border:1px solid var(--line);padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ochre)} button:focus-visible{outline:2px solid var(--ochre);outline-offset:1px} button.on{background:var(--ochre);color:var(--bg);border-color:var(--ochre)} button.hot{background:var(--brick);border-color:var(--brick)} button:disabled{opacity:.35;cursor:default}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:#100d0b}
#bar .hint{font:11px var(--mono);color:var(--muted);flex:1;min-width:0;text-align:right}
.ov{position:absolute;inset:0;background:rgba(10,8,7,.93);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(760px,100%);display:flex;flex-direction:column;gap:16px}
.sheet h1{margin:0;font:600 28px var(--serif)} .sheet h2{margin:0;font:600 17px var(--serif)} .sheet p{margin:0;line-height:1.5;max-width:68ch} .sheet .muted{color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px} .q{display:flex;flex-direction:column;gap:6px;min-width:0}
.opt{text-align:left;font:13px/1.35 var(--sans);padding:9px 10px;display:flex;flex-direction:column;gap:3px} .opt b{font:500 12px var(--mono);letter-spacing:.06em} .opt span{color:var(--muted);font-size:12px} .opt.on span{color:#3a2c14}
.cardrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} .pc{border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.4}
table{border-collapse:collapse;width:100%;font-size:13px} td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top} th{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ochre)} td.bad{color:var(--brick)} td.ok{color:var(--good)}
@media (max-width:760px){ #left{width:200px;padding:8px 10px;gap:6px} #clock{font-size:22px} .layer ul{display:none} #log{display:none} #prompt{max-width:calc(100% - 24px);top:auto;bottom:10px} .grid3,.cardrow{grid-template-columns:minmax(0,1fr)} #bar .hint{display:none} }
</style>

<div id="app">
  <div id="stage">
    <canvas id="c"></canvas><div id="labels"></div>
    <div id="left" class="panel">
      <div><div id="clock">23:04:00</div><div id="dep">The 23:05 leaves in 70 s</div></div>
      <div class="layer"><span class="k">Clockwork · runs whatever you do</span><ul id="cw"></ul></div>
      <div class="layer"><span class="k">Entrusted · Mbali, as herself</span><div id="ent">Waiting where you put her.</div></div>
      <div class="layer"><span class="k">In hand · you</span><div id="status"><span>Health <b id="s-hp">fine</b></span><span>Rounds <b id="s-am">15</b></span><span>Gun <b id="s-gun">holstered</b></span></div></div>
    </div>
    <div id="log" class="panel"></div>
    <div id="prompt" class="panel" hidden></div>
    <div id="table" class="ov"></div>
    <div id="count" class="ov" hidden></div>
  </div>
  <div id="bar">
    <button id="b-gun" type="button">Draw (Space)</button>
    <button id="b-help" type="button" disabled>Help with the pushchair (E)</button>
    <button id="b-rot" type="button">Turn view (Q)</button>
    <button id="b-plan" type="button">Back to the table</button>
    <span class="hint">Click the floor to move, or use WASD. With the gun drawn, click a man to fire at him.</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE || document.write('<script src="vendor/three.min.js"><\/script>');</script>
<script>
"use strict";
const $ = s => document.querySelector(s);
/* ---------- plan ---------- */

    <span class="k">A set-piece sandbox · the table</span><h1>Platform Four</h1>
    <p>A clerk who kept the books for the wrong people is leaving town on the 23:05. Three men will walk him through the hall and up the stairs to the platform. You need him alive and off that train. You have one colleague, and about a minute once the clock starts.</p>
    <div class="cardrow">
      <div class="pc"><span class="k">Clockwork · what you know will happen</span>23:04:08 a woman with a pushchair and two bags starts up the stairs, alone.<br>23:04:30 the four of them come in from the street.<br>23:04:40 they reach the stairs.<br>23:05:10 the train leaves.</div>
      <div class="pc"><span class="k">Entrusted · Sgt Mbali Zondi</span>A steady shot, and slow to start one. She will not fire if a bystander is anywhere near her line. If a child is in danger she goes to the child before anything else, whatever you told her.</div>

    <h2>Three decisions</h2>
    <div class="grid3">${group("place", "Where Mbali stands")}${group("signal", "What starts it")}${group("hall", "The bystanders")}</div>
    <div><button type="button" id="go" class="on">Start the clock</button></div>

/* ---------- stage ---------- */
const canvas = $("#c"), renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x100e12);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -200, 400);
scene.add(new THREE.AmbientLight(0xb0a0b8, .95)); const sun = new THREE.DirectionalLight(0xffd0a0, .55); sun.position.set(-30, 40, 10); scene.add(sun);
let world = new THREE.Group(); scene.add(world);
const cam = { yaw: Math.PI * .8, zoom: 1, t: new THREE.Vector3(0, 2, 22) };
const mat = c => new THREE.MeshLambertMaterial({ color: c });
function box(x, z, w, d, h, c, y = 0) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.position.set(x, y + h / 2, z); world.add(m); return m; }

const PILLARS = [[-6, 10], [6, 10], [-6, 16], [6, 16], [-7, 35], [7, 35]];
let labels = [];
function build() {

  for (let i = 0; i < 12; i++) box(0, 20.5 + i, 12, 1, (i + 1) / 3, 0x5c5046); // stairs
  box(-9.5, 26, 7, 12, 4, 0x3a322c); box(9.5, 26, 7, 12, 4, 0x3a322c);      // flanks
  box(0, 37, 26, 10, .2, 0x52463c, 3.8);                                    // upper concourse
  box(0, 42.2, 26, .4, 5, 0x2f2823, 4); box(0, 42, 4, .5, 3, 0x7b8f9a, 4);  // platform wall and doors

  box(-9, 6, 3.5, .8, .5, 0x3d2f22); box(9, 6, 3.5, .8, .5, 0x3d2f22);      // benches

}
function person(c, hat) {
  const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.CylinderGeometry(.32, .38, 1.25, 10), mat(c)); b.position.y = .62;
  const h = new THREE.Mesh(new THREE.SphereGeometry(.26, 10, 8), mat(0x6b4a36)); h.position.y = 1.45; g.add(b, h);

  world.add(g); return g;
}
function label(e, text, cls) { const el = document.createElement("div"); el.className = "lab " + (cls || ""); el.textContent = text; $("#labels").appendChild(el); const l = { e, el }; labels.push(l); return l; }
/* ---------- simulation ---------- */
let G = null, seed = 7;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
function ent(name, x, z, color, o = {}) { const e = Object.assign({ name, x, z, hp: 2, down: false, gun: false, mesh: person(color, o.hat), cd: 0, tx: null, tz: null, sp: 2.2 }, o); if (o.cls) e.lab = label(e, name, o.cls); return e; }
function log(t) { const d = document.createElement("div"); d.textContent = clockStr(G.t).slice(3) + "  " + t; $("#log").prepend(d); while ($("#log").children.length > 14) $("#log").lastChild.remove(); }
const clockStr = t => { const s = 4 * 60 + Math.floor(t); return `23:${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };

function tracer(a, b, c) { const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(a.x, yAt(a.z) + 1.2, a.z), new THREE.Vector3(b.x, yAt(b.z) + 1.1, b.z)]); const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: c })); world.add(l); setTimeout(() => world.remove(l), 130); }
function shoot(from, to, base) {

function alert(why) {

}

const CW = [[8, "A woman starts up the stairs with a pushchair"], [30, "Four men come in from the street"], [40, "They reach the stairs"], [70, "The train leaves"]];
function start() {

}
function moveTo(e, dt) {

const keys = {};
function step(dt) {
